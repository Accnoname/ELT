version: '3'

services:
  source_postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    networks:
      - elt_network
    environment:
      - POSTGRES_DB=source_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql

  destination_postgres:
    image: postgres:17
    ports:
      - "5434:5432"
    networks:
      - elt_network
    environment:
      - POSTGRES_DB=destination_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret

  elt_script:
    build:
      context: ./elt
      dockerfile: Dockerfile
    command: ["python", "elt-script.py"]
    networks:
      - elt_network
    depends_on:
      - source_postgres
      - destination_postgres

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.4.7
    command: ["run", "--profiles-dir", "/root", "--project-dir", "/dbt"]
    networks:
      - elt_network
    volumes:
      - ./elt_transform:/dbt
      - ~/.dbt:/root
    depends_on:
      - destination_postgres
      - elt_script
    environment:
      - DBT_PROFILE=default
      - DBT_TARGET=dev

  # ── AIRFLOW ──────────────────────────────────────────────
  # DB riêng lưu metadata của Airflow (tasks, logs, DAGs...)
  postgres:
    image: postgres:latest
    networks:
      - elt_network
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow

  # Khởi tạo DB + tạo user admin cho Airflow (chạy 1 lần rồi exit)
  init-airflow:
    image: apache/airflow:latest
    depends_on:
      - postgres
    networks:
      - elt_network
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      bash -c "airflow db init &&
               airflow users create
                 --username airflow
                 --password password
                 --firstname airflow
                 --lastname airflow
                 --role Admin
                 --email airflow@example.com"

  # Giao diện web Airflow
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - init-airflow
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt_transform:/opt/dbt
      - ~/.dbt:/root/.dbt
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    ports:
      - "8080:8080"
    command: webserver

  # Scheduler chạy DAGs theo lịch
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - init-airflow
    networks:
      - elt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./elt_transform:/opt/dbt
      - ~/.dbt:/root/.dbt
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    command: scheduler

networks:
  elt_network:
    driver: bridge
